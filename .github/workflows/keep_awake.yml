name: Keep Streamlit app awake

# Visita o app com um navegador headless para reiniciar o contador de
# inatividade do Streamlit (o app dorme após 12h sem tráfego).

on:
  schedule:
    # A cada 6 horas (UTC). O limite de hibernação é 12h; 6h dá margem de sobra
    # para atrasos do agendador do GitHub. Para 12h use: "0 0,12 * * *".
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: false

env:
  STREAMLIT_URL: https://portfolio-selection.streamlit.app

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit the app
        env:
          STREAMLIT_URL: ${{ vars.STREAMLIT_URL }}
          KEEP_AWAKE_DWELL: "25"
        run: python keep_awake.py
